<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อจำลอง (ENG23 3074)</title>
    <style>
        /* CSS: ส่วนของ Frontend (การตกแต่ง) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* ให้ padding ไม่เพิ่มความกว้าง */
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #ecf0f1;
        }
        .success-msg {
            color: #27ae60;
            text-align: center;
            font-weight: bold;
            display: none; /* ซ่อนไว้ก่อน */
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🚀 ระบบเช็คชื่อจำลอง</h1>

    <!-- ส่วนรับข้อมูล (จำลอง Frontend Form) -->
    <div class="container">
        <h2>ลงชื่อเข้าเรียน</h2>
        <div class="form-group">
            <label for="studentId">รหัสนักศึกษา:</label>
            <input type="text" id="studentId" placeholder="เช่น B6618599" required>
        </div>
        <div class="form-group">
            <label for="studentName">ชื่อ-นามสกุล:</label>
            <input type="text" id="studentName" placeholder="เช่น สรายุทธ อินโสภา" required>
        </div>
        <button onclick="checkIn()">บันทึกการเข้าเรียน</button>
        <p id="message" class="success-msg">บันทึกข้อมูลเรียบร้อย!</p>
    </div>

    <!-- ส่วนแสดงผล (จำลองการดึงข้อมูลจาก Database) -->
    <div class="container">
        <h2>ประวัติการเช็คชื่อวันนี้</h2>
        <table id="attendanceTable">
            <thead>
                <tr>
                    <th>เวลา</th>
                    <th>รหัสนักศึกษา</th>
                    <th>ชื่อ-นามสกุล</th>
                    <th>สถานะ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- ข้อมูลจะถูกเติมเข้ามาตรงนี้ด้วย JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // JavaScript: ส่วนของ Backend Logic & Database แบบง่ายๆ

        // 1. จำลอง Database (เก็บข้อมูลไว้ใน Array)
        let attendanceRecord = [];

        // ฟังก์ชันอัปเดตตาราง (เหมือน GET API ขอข้อมูลจาก DB มาแสดง)
        function updateTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // ล้างข้อมูลเก่าก่อน

            attendanceRecord.forEach(record => {
                const row = `<tr>
                    <td>${record.time}</td>
                    <td>${record.id}</td>
                    <td>${record.name}</td>
                    <td style="color: green; font-weight: bold;">เข้าเรียน</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // ฟังก์ชันเช็คชื่อ (เหมือน POST API ส่งข้อมูลไปเซฟใน DB)
        function checkIn() {
            const idInput = document.getElementById('studentId').value;
            const nameInput = document.getElementById('studentName').value;
            const msgElement = document.getElementById('message');

            // ตรวจสอบข้อมูลว่าง (Validation - Logic พื้นฐานที่ Backend ต้องทำ)
            if (idInput.trim() === '' || nameInput.trim() === '') {
                alert('กรุณากรอกรหัสและชื่อให้ครบถ้วน!');
                return;
            }

            // ดึงเวลาปัจจุบัน
            const now = new Date();
            const timeString = now.toLocaleTimeString('th-TH');

            // 2. จำลองการ Insert ลง Database
            const newRecord = {
                time: timeString,
                id: idInput,
                name: nameInput
            };
            attendanceRecord.push(newRecord);

            // แสดงข้อความสำเร็จ
            msgElement.style.display = 'block';
            setTimeout(() => {
                msgElement.style.display = 'none';
            }, 2000); // ซ่อนข้อความหลัง 2 วินาที

            // ล้างฟอร์ม
            document.getElementById('studentId').value = '';
            document.getElementById('studentName').value = '';

            // อัปเดตตารางเพื่อแสดงข้อมูลใหม่
            updateTable();
        }

        // โหลดข้อมูลเบื้องต้นตอนเปิดหน้าเว็บ (ถ้ามี)
        updateTable();
    </script>

</body>
</html>
